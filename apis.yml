aid: microsoft-project
name: Microsoft Project
description: Microsoft Project is a project management software product developed by Microsoft. It provides tools for developing
  plans, assigning resources to tasks, tracking progress, managing budgets, and analyzing workloads. Microsoft Project offers
  REST APIs via SharePoint/Project Online, a Client-Side Object Model (CSOM), OData reporting feeds, and JavaScript APIs for
  building add-ins and integrations.
type: Index
accessModel:
  pricing: paid
  onboarding: self-serve
  trial: false
  try_now: false
  public: false
  label: Paid · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/microsoft-project.png
tags:
- Budgeting
- Gantt Charts
- Microsoft
- Portfolio Management
- Project Management
- Resource Management
- Scheduling
- Task Management
url: https://raw.githubusercontent.com/api-evangelist/microsoft-project/refs/heads/main/apis.yml
created: '2024-01-15'
modified: '2026-05-19'
specificationVersion: '0.23'
apis:
- aid: microsoft-project:csom-api
  name: Microsoft Project Online CSOM API
  description: >-
    Client-Side Object Model API for programmatic access to Project Online and Project Server. Provides
    .NET, Silverlight, Windows Phone, and JavaScript interfaces for CRUD operations on projects, tasks,
    resources, assignments, custom fields, lookup tables, and enterprise project types.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: >-
    https://learn.microsoft.com/en-us/office/client-developer/project/client-side-object-model-csom-for-project-2013
  baseURL: https://{tenant}.sharepoint.com/sites/pwa/_api/ProjectServer
  tags:
  - .NET
  - Client Library
  - CSOM
  - JavaScript
  - Projects
  - Resources
  - Tasks
  properties:
  - type: Documentation
    url: >-
      https://learn.microsoft.com/en-us/office/client-developer/project/client-side-object-model-csom-for-project-2013
  - type: SDKs
    url: https://www.nuget.org/packages/Microsoft.SharePointOnline.CSOM/
    title: .NET SDK
  - type: GettingStarted
    url: >-
      https://learn.microsoft.com/en-us/office/client-developer/project/getting-started-with-the-project-server-csom-and-.net
- aid: microsoft-project:odata-reporting-api
  name: Microsoft Project OData Reporting API
  description: >-
    OData-based reporting feed for read-only access to Project Server and Project Online reporting data.
    Provides access to project, task, resource, assignment, and timesheet reporting tables and views via
    the ProjectData service endpoint.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: >-
    https://learn.microsoft.com/en-us/office/client-developer/project/project-server-2013-architecture
  baseURL: https://{tenant}.sharepoint.com/sites/pwa/_api/ProjectData
