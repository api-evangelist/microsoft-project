- aid: microsoft-project:javascript-api
  name: Microsoft Project JavaScript API
  description: >-
    JavaScript API for building Office Add-ins that extend Microsoft Project desktop client. Enables reading
    task, resource, and view data from the active project within a task pane add-in.
